<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THERAT — Recetario</title>
  <meta name="description" content="Tres recetas exclusivas de THERAT: Espresso, Mosco Mulé y Caliu Up.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #0A0A0A;
      --card:   #141414;
      --surf:   #1D1D1D;
      --text:   #F5F5F5;
      --body:   #B5B5B5;
      --label:  #8C8C8C;
      --muted:  #6A6A6A;
      --line:   #2E2E2E;
      --orange: #FF7937;
      --honey:  #E0AB43;
      --caliu:  #C4722A;
      --font:   'Montserrat', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font); -webkit-font-smoothing: antialiased;
    }
    button { background: none; border: none; cursor: pointer; font-family: var(--font); color: inherit; -webkit-tap-highlight-color: transparent; }
    img { display: block; }
    a { color: inherit; text-decoration: none; }

    /* ══ CHIP ══ */
    .chip {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 5px 13px; border-radius: 100px;
    }
    .chip.orange { color: var(--orange); border: 1px solid rgba(255,121,55,0.55); background: rgba(255,121,55,0.1); }
    .chip.honey  { color: var(--honey);  border: 1px solid rgba(224,171,67,0.55); background: rgba(224,171,67,0.1); }
    .chip.caliu  { color: var(--caliu);  border: 1px solid rgba(196,114,42,0.55); background: rgba(196,114,42,0.1); }
    .chip.dual   { color: var(--text);   border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); }

    /* ════════════════════════════
       MOBILE  (< 1024px)
    ════════════════════════════ */
    @media (max-width: 1023px) {
      html, body { height: 100%; overflow: hidden; }
      #app { position: fixed; inset: 0; overflow: hidden; }
      .screen { display: none; width: 100%; height: 100%; }
      .screen.active { display: block; }

      /* HOME */
      #home { overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }
      .home-head { padding: 56px 24px 28px; display: flex; flex-direction: column; align-items: center; text-align: center; }
      .home-logo { height: 36px; width: auto; margin-bottom: 22px; }
      .home-title { font-size: clamp(38px, 10.5vw, 56px); font-weight: 800; letter-spacing: -0.02em; line-height: 1; text-transform: uppercase; }
      .home-sub { font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 12px; }
      .cards { padding: 12px 16px 80px; display: flex; flex-direction: column; gap: 10px; }
      .card { position: relative; overflow: hidden; border-radius: 10px; height: clamp(220px, 34vw, 290px); cursor: pointer; background: var(--surf); transition: transform 0.15s ease; }
      .card:active { transform: scale(0.985); opacity: 0.9; }
      .card-name { font-size: clamp(26px, 7.5vw, 36px); font-weight: 800; text-transform: uppercase; letter-spacing: -0.015em; line-height: 0.95; }

      /* DETAIL mobile */
      #detail { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); }
      .hero-img { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; object-fit: cover; filter: brightness(0.48) saturate(0.65); z-index: 0; pointer-events: none; }
      .hero-grad { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: linear-gradient(to top, rgba(20,20,20,0.97) 0%, rgba(12,12,12,0.45) 35%, rgba(0,0,0,0.1) 65%, transparent 82%); z-index: 1; pointer-events: none; }
      .back { position: fixed; top: 0; left: 0; width: 100%; padding: 48px 24px 24px; background: linear-gradient(to bottom, rgba(0,0,0,0.62) 38%, transparent); display: flex; align-items: center; gap: 10px; z-index: 30; cursor: pointer; }
      .back-arrow { font-size: 18px; color: rgba(255,255,255,0.48); }
      .back-label { font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.38); }
      .hero-text { position: fixed; bottom: max(calc(44vh + 16px), calc(100vh - 488px + 16px)); left: 0; width: 100%; padding: 0 28px; z-index: 5; pointer-events: none; }
      .hero-chip { margin-bottom: 11px; }
      .hero-name { font-size: clamp(36px, 10.5vw, 52px); font-weight: 800; text-transform: uppercase; letter-spacing: -0.015em; line-height: 0.94; }
      .hero-spacer { height: 56vh; max-height: 488px; flex-shrink: 0; position: relative; z-index: 2; }
      .recipe-card { position: relative; z-index: 10; background: var(--card); border-radius: 24px 24px 0 0; min-height: 100vh; padding-bottom: 96px; box-shadow: 0 -32px 64px rgba(0,0,0,0.6); }
      .rc-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 14px auto 0; }

      /* Desktop-only elements hidden on mobile */
      .dt-left, #dt-home-hero { display: none !important; }
      /* Home header is mobile-only */
      .home-head { display: block; }
    }

    /* ════════════════════════════
       DESKTOP  (≥ 1024px)
    ════════════════════════════ */
    @media (min-width: 1024px) {
      #app { display: block; }
      .screen { display: none; }
      .screen.active { display: block; }

      /* Mobile-only elements hidden on desktop */
      .hero-img, .hero-grad, .back, .hero-text, .hero-spacer, .rc-handle { display: none !important; }

      /* HOME desktop */
      #home { background: var(--bg); min-height: 100vh; }
      .home-head { display: none; }

      #dt-home-hero {
        position: relative; height: 56vh; min-height: 440px;
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        overflow: hidden; padding: 0 80px 64px;
        text-align: center;
      }
      .dt-home-bg {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: center 30%;
        filter: brightness(0.38) saturate(0.6);
      }
      .dt-home-veil {
        position: absolute; inset: 0;
        background: linear-gradient(to top, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.3) 50%, transparent 100%);
      }
      .dt-home-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
      .dt-home-logo { height: 44px; width: auto; margin-bottom: 28px; }
      .dt-home-title { font-size: clamp(72px, 9vw, 118px); font-weight: 800; letter-spacing: -0.03em; line-height: 0.95; text-transform: uppercase; }
      .dt-home-sub { font-size: 12px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); margin-top: 16px; }

      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 40px 80px 100px; }
      .card {
        position: relative; overflow: hidden; border-radius: 14px;
        height: clamp(360px, 42vh, 560px); cursor: pointer; background: var(--surf);
        transition: transform 0.2s ease;
      }
      .card:hover { transform: translateY(-5px); }
      .card-name { font-size: clamp(28px, 2.8vw, 40px); font-weight: 800; text-transform: uppercase; letter-spacing: -0.015em; line-height: 0.95; }

      /* DETAIL desktop */
      #detail { display: none; }
      #detail.active { display: flex; min-height: 100vh; align-items: flex-start; }

      .dt-left {
        position: sticky; top: 0;
        width: 50%; height: 100vh;
        flex-shrink: 0; overflow: hidden;
      }
      .dt-left-img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: center;
        filter: brightness(0.48) saturate(0.65);
      }
      .dt-left-veil {
        position: absolute; inset: 0;
        background: linear-gradient(to right, transparent 50%, var(--bg) 100%);
        pointer-events: none;
      }
      .dt-back {
        position: absolute; top: 48px; left: 52px;
        display: flex; align-items: center; gap: 10px; z-index: 10;
      }
      .dt-back-arrow { font-size: 16px; color: rgba(255,255,255,0.45); }
      .dt-back-label { font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.38); }
      .dt-back:hover .dt-back-label, .dt-back:hover .dt-back-arrow { color: rgba(255,255,255,0.72); }
      .dt-left-text { position: absolute; bottom: 72px; left: 56px; right: 48px; z-index: 5; }
      .dt-left-chip { margin-bottom: 14px; }
      .dt-left-name { font-size: clamp(44px, 4.5vw, 68px); font-weight: 800; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.93; }

      .recipe-card { flex: 1; background: var(--card); border-radius: 0; min-height: 100vh; padding-bottom: 120px; }
    }

    /* ════════════════════════════
       SHARED — cards + recipe
    ════════════════════════════ */
    .card-photo {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      filter: brightness(0.42) saturate(0.6);
      transition: transform 0.35s ease;
    }
    .card:hover .card-photo { transform: scale(1.04); }
    .card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,0.95) 14%, transparent 62%);
      padding: 28px;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
    }
    .card-chip { margin-bottom: 9px; }

    /* Recipe card interior */
    .rc-header { padding: 32px 32px 24px; border-bottom: 1px solid var(--line); }
    .rc-desc { font-size: 16px; font-weight: 400; color: var(--body); line-height: 1.76; text-wrap: pretty; }

    .stats { display: flex; margin: 28px 32px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .stat { flex: 1; padding: 16px 12px; text-align: center; border-right: 1px solid var(--line); }
    .stat:last-child { border-right: none; }
    .stat-val { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .stat-key { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }

    .section { padding: 36px 32px 0; }
    .sec-label {
      display: flex; align-items: center; gap: 14px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--label); margin-bottom: 22px; white-space: nowrap;
    }
    .sec-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    .fpills { display: flex; flex-wrap: wrap; gap: 8px; }
    .fpill { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 14px; border: 1px solid var(--line); border-radius: 100px; color: var(--label); }

    .prop-list { border-top: 1px solid var(--line); }
    .prop-row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .prop-row:last-child { border-bottom: none; }
    .prop-img { width: 44px; height: 44px; border-radius: 50%; background: var(--surf); border: 1px solid var(--line); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .prop-img img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85); }
    .prop-fallback { font-size: 13px; font-weight: 800; color: var(--muted); }
    .prop-amt { font-size: 16px; font-weight: 700; color: var(--text); min-width: 64px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .prop-ing { font-size: 15px; font-weight: 400; color: var(--body); line-height: 1.4; }

    .steps-list { border-top: 1px solid var(--line); }
    .step { display: grid; grid-template-columns: 32px 1fr; gap: 18px; padding: 20px 0; border-bottom: 1px solid var(--line); }
    .step:last-child { border-bottom: none; }
    .step-n { width: 28px; height: 28px; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .step-txt { font-size: 15px; font-weight: 400; color: var(--body); line-height: 1.72; text-wrap: pretty; }

    .bar-tip { margin: 28px 32px 0; padding: 18px 20px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--surf); }
    .bar-tip-label { font-size: 9px; font-weight: 700; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
    .bar-tip-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px; letter-spacing: -0.01em; }
    .bar-tip-steps { display: flex; flex-direction: column; gap: 7px; }
    .bar-tip-step { display: flex; gap: 10px; align-items: baseline; font-size: 13px; font-weight: 400; color: var(--body); line-height: 1.55; }
    .bar-tip-step-n { font-size: 10px; font-weight: 700; color: var(--muted); flex-shrink: 0; width: 14px; text-align: right; }

    .raw-egg-warn { margin: 24px 32px 0; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; background: rgba(255,255,255,0.03); font-size: 12px; font-weight: 400; color: var(--muted); line-height: 1.65; }
    .raw-egg-warn strong { color: var(--label); font-weight: 600; }

    /* ── BUY BAR ── */
    #buy-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 20px 40px;
      background: linear-gradient(to top, rgba(10,10,10,1) 55%, transparent);
      z-index: 100; display: none;
    }
    #buy-bar.visible { display: flex; gap: 10px; justify-content: center; }
    @media (min-width: 1024px) {
      #buy-bar { left: auto; right: 48px; bottom: 48px; width: auto; padding: 0; background: none; }
      #buy-bar.visible { display: flex; flex-direction: row; gap: 10px; }
    }
    .buy-btn-link {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px;
      padding: 16px 24px; border-radius: 100px;
      font-family: var(--font); font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      text-decoration: none; cursor: pointer;
      transition: opacity 0.15s; -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(6px);
    }
    .buy-btn-link:active { opacity: 0.7; }
    .buy-btn-link.orange { color: var(--orange); border: 1px solid rgba(255,121,55,0.5); background: rgba(255,121,55,0.13); }
    .buy-btn-link.honey  { color: var(--honey);  border: 1px solid rgba(224,171,67,0.5); background: rgba(224,171,67,0.13); }
    .buy-btn-link.caliu  { color: var(--caliu);  border: 1px solid rgba(196,114,42,0.5); background: rgba(196,114,42,0.13); }
    @media (min-width: 1024px) {
      .buy-btn-link { flex: none; padding: 16px 32px; box-shadow: 0 8px 40px rgba(0,0,0,0.55); }
    }

    /* Mobile padding override for recipe card internals */
    @media (max-width: 1023px) {
      .rc-header { padding: 24px 24px 20px; }
      .stats { margin: 24px 24px 0; }
      .section { padding: 32px 24px 0; }
      .bar-tip { margin: 28px 24px 0; }
      .raw-egg-warn { margin: 24px 24px 0; }
    }
  </style>
</head>

  <div id="buy-bar"></div>

        { amt: '3 cl', name: 'Lima natural',           img: IMG.lima },
        { amt: '2 cl', name: 'Azúcar líquido',         img: IMG.azucar },
        { amt: 'c/n',  name: 'Menta (en el shake)',    img: IMG.menta },
        { amt: '—',    name: 'Ginger beer',            img: IMG.ginger },
      ],
      steps: [
        'Pon la ratafia, la lima, el azúcar y unas hojas de menta en la coctelera con hielo.',
        'Shake fuerte.',
        'Doble colado en vaso largo con hielo nuevo.',
        'Termina con ginger beer al gusto.',
      ],
      tip: {
        title: 'Caramelo líquido casero',
        steps: [
          'Pon azúcar en un cazo a fuego medio sin remover hasta que empiece a tomar color ámbar.',
          'Añade agua caliente poco a poco con cuidado — puede salpicar. Remueve hasta disolver.',
          'Deja enfriar y guarda en un bote de cristal. Aguanta 2 semanas en nevera.',
        ]
      }
    },
    {
      id: 'caliu-up',
      name: 'Caliu Up',
      variant: 'caliu',
      variantLabel: 'THERAT Caliu',
      description: 'Caliu, lima y Seven Up. El highball tropical con el carácter especiado de la ratafía y toda la frescura del cítrico.',
      time: '2 min',
      glass: 'Vaso highball',
      img: 'Imagens/Caliu up.jpeg',
      flavors: ['Tropical', 'Cítrico', 'Fresco', 'Especiado'],
      rawEgg: false,
      ingredients: [
        { amt: '6 cl', name: 'Ratafia Caliu THERAT', img: 'Imagens/Caliu01.jpg' },
        { amt: '3 cl', name: 'Zumo de lima',          img: IMG.lima },
        { amt: 'c/n',  name: 'Menta fresca',          img: IMG.menta },
        { amt: '—',    name: 'Seven Up',              img: null },
      ],
      steps: [
        'Pon la Ratafia Caliu y el zumo de lima en el vaso highball con hielo.',
        'Stir suave — remueve para integrar sin perder la carbonatación.',
        'Añade el Seven Up al final hasta llenar el vaso.',
        'Garnish de menta fresca.',
      ]
    }
  ];

  /* ── RENDER HOME CARDS ── */
  const cardsEl = document.getElementById('js-cards');
  COCKTAILS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', 'Ver receta: ' + c.name);
    el.innerHTML = `
      <img src="${c.img}" alt="${c.name}" class="card-photo" loading="${i === 0 ? 'eager' : 'lazy'}">
      <div class="card-overlay">
        <div class="card-chip"><span class="chip ${c.variant}">${c.variantLabel}</span></div>
        <p class="card-name">${c.name}</p>
      </div>`;
    el.addEventListener('click', () => openDetail(c));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(c); } });
    cardsEl.appendChild(el);
  });

  /* ── RECIPE HTML FRAGMENTS ── */
  function recipeInnerHTML(c) {
    const ings = c.ingredients.map(ing => {
      const inner = ing.img
        ? `<img src="${ing.img}" alt="" loading="lazy">`
        : `<span class="prop-fallback">${ing.name.charAt(0).toUpperCase()}</span>`;
      return `<div class="prop-row"><div class="prop-img">${inner}</div><span class="prop-amt">${ing.amt}</span><span class="prop-ing">${ing.name}</span></div>`;
    }).join('');

    const steps = c.steps.map((s, i) =>
      `<div class="step"><div class="step-n">${i + 1}</div><p class="step-txt">${s}</p></div>`
    ).join('');

    const tipHtml = c.tip ? `
      <div class="bar-tip">
        <p class="bar-tip-label">Básico de barra</p>
        <p class="bar-tip-title">${c.tip.title}</p>
        <div class="bar-tip-steps">${c.tip.steps.map((s, i) =>
          `<div class="bar-tip-step"><span class="bar-tip-step-n">${i+1}.</span><span>${s}</span></div>`).join('')}
        </div>
      </div>` : '';

    const warnHtml = c.rawEgg ? `
      <div class="raw-egg-warn">
        <strong>Aviso</strong> — Esta receta contiene clara de huevo crudo. Puede sustituirse por clara pasteurizada.
      </div>` : '';

    return { ings, steps, tipHtml, warnHtml };
  }

  /* ── OPEN DETAIL ── */
  function openDetail(c) {
    const isDesktop = window.innerWidth >= 1024;
    const { ings, steps, tipHtml, warnHtml } = recipeInnerHTML(c);

    // Shared recipe card content
    document.getElementById('d-desc').textContent = c.description;
    document.getElementById('d-stats').innerHTML = `
      <div class="stat"><p class="stat-val">${c.time}</p><p class="stat-key">Tiempo</p></div>
      <div class="stat"><p class="stat-val">${c.glass}</p><p class="stat-key">Copa</p></div>
      <div class="stat"><p class="stat-val">${c.ingredients.length}</p><p class="stat-key">Ingredientes</p></div>`;
    document.getElementById('d-flavors').innerHTML = c.flavors.map(f => `<span class="fpill">${f}</span>`).join('');
    document.getElementById('d-ingredients').innerHTML = ings;
    document.getElementById('d-steps').innerHTML = steps;

    const tipEl = document.getElementById('d-tip');
    if (c.tip) {
      document.getElementById('d-tip-title').textContent = c.tip.title;
      document.getElementById('d-tip-steps').innerHTML = c.tip.steps
        .map((s, i) => `<div class="bar-tip-step"><span class="bar-tip-step-n">${i+1}.</span><span>${s}</span></div>`).join('');
      tipEl.style.display = 'block';
    } else {
      tipEl.style.display = 'none';
    }
    document.getElementById('d-egg-warn').style.display = c.rawEgg ? 'block' : 'none';

    if (isDesktop) {
      // Desktop: populate left panel
      document.getElementById('dt-img').src = c.img;
      document.getElementById('dt-img').alt = c.name;
      document.getElementById('dt-chip').innerHTML = `<span class="chip ${c.variant}">${c.variantLabel}</span>`;
      document.getElementById('dt-name').textContent = c.name.toUpperCase();
      window.scrollTo(0, 0);
    } else {
      // Mobile: populate fixed elements
      document.getElementById('d-img').src = c.img;
      document.getElementById('d-img').alt = c.name;
      document.getElementById('d-chip').innerHTML = `<span class="chip ${c.variant}">${c.variantLabel}</span>`;
      document.getElementById('d-name').textContent = c.name.toUpperCase();
      const det = document.getElementById('detail');
      det.scrollTop = 0;
    }

    document.getElementById('home').classList.remove('active');
    document.getElementById('detail').classList.add('active');

    // Buy bar
    const bar = document.getElementById('buy-bar');
    const variants = c.variant === 'dual' ? ['orange', 'honey'] : [c.variant];
    bar.innerHTML = variants.map(v =>
      `<a class="buy-btn-link ${v}" href="${BUY_URLS[v]}" target="_blank" rel="noopener">${CART_SVG} ${BUY_LABELS[v]}</a>`
    ).join('');
    bar.classList.add('visible');
  }

  /* ── BACK ── */
  function goHome() {
    document.getElementById('detail').classList.remove('active');
    document.getElementById('home').classList.add('active');
    document.getElementById('buy-bar').classList.remove('visible');
    if (window.innerWidth >= 1024) window.scrollTo(0, 0);
  }
  document.getElementById('js-back').addEventListener('click', goHome);
  document.getElementById('dt-back').addEventListener('click', goHome);
</script>
</body>
</html>
